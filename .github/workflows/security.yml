name: Security checks

# zizmor audits the workflows (adoption-day: two input-injection sites in publish.yml,
# six credential-persisting checkouts, and two unpinned validator installs -- all fixed;
# the three deliberate exceptions live in .github/zizmor.yml with their reasons).
# actionlint checks workflow correctness. ShellCheck is deliberately NOT run here: every
# shell script in this repository is generated from the catalog and verified
# byte-identical to its source by the generated-only check, and the catalog lints the
# sources -- a second lint of the same bytes would be signal-free.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054  # v0.6.2
        with:
          min-severity: low

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color
