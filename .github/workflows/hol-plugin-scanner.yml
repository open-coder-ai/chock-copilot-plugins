name: HOL plugin scanner

# Runs hashgraph-online's AI plugin scanner over this repository's published plugins.
#
# It is a report, not a gate, and that is deliberate rather than provisional: `min_score`
# and `fail_on_severity` are left at the action's non-failing defaults because the scanner
# cannot distinguish a guardrail from the attack it names. Two of this repository's plugins
# are flagged HIGH for quoting the very patterns they block -- `block(remote_exec): fetch
# (curl|wget) piped into an interpreter` is the literal text of a *block* rule, scored as a
# remote-code-execution pattern. Arming a gate on that would train people to route around
# it. What the run is worth is the rest: manifest, metadata, licence and hygiene signals
# across every published plugin, on every push and pull request, in one place a reviewer
# can read.
#
# `submission_enabled` is pinned to false explicitly, not left to the default: this action
# can open submission issues in third-party catalogue repositories, and publishing a score
# for a security product is a decision the owner makes deliberately, never a side effect of
# a CI run.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false

      - name: Scan the published plugins
        # Pinned by commit rather than by the `v1` tag their docs give: `v1` is a moving
        # tag that has been re-pointed across 560 releases, so `@v1` is a promise that the
        # code running here can change without a diff in this repository. The SHA below is
        # what `v1` resolved to when this was added.
        uses: hashgraph-online/ai-plugin-scanner-action@f344c80c093464413432b399f38a7ba2f3365ae2  # v1.2.560
        with:
          mode: scan
          plugin_dir: .
          format: text
          write_step_summary: true
          submission_enabled: false
