# generated by `chock marketplace build`; edits are overwritten.
# This repository is rebuilt from chock-catalog, so an issue filed here cannot be fixed here.
blank_issues_enabled: false
contact_links:
  - name: A policy blocks too much, too little, or claims more than it does
    url: https://github.com/open-coder-ai/chock-catalog/issues/new/choose
    about: Policy content lives in chock-catalog; this repository is rebuilt from it.
  - name: A plugin, hook or manifest is built wrong
    url: https://github.com/open-coder-ai/chock/issues/new/choose
    about: chock compiles the catalog into these plugins; emitter and hook-wiring bugs go there.
  - name: Report a security issue privately
    url: https://github.com/open-coder-ai/chock/security/advisories/new
    about: The route this repository's SECURITY.md names. Please do not open a public issue for a vulnerability.
